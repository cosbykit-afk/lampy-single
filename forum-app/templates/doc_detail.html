{% extends "base.html" %}
{% block title %}{{ doc.title }}{% endblock %}
{% block content %}
<h2>{{ doc.title }}</h2>
<p>{{ doc.body }}</p>
<p><img src="{{ url_for('doc_image', slug=doc.slug) }}"
        alt="{{ doc.title }}" style="max-width:100%; border:1px solid #ccc;"></p>
<p><small>Kind: {{ doc.diagram_kind }} &middot; stored {{ doc.created_at }}
   &middot; <a href="{{ url_for('doc_image', slug=doc.slug) }}">open image</a>
   &middot; <a href="{{ url_for('docs_index') }}">&larr; all docs</a></small></p>
{% endblock %}
