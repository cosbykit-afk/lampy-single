{% extends "base.html" %}
{% block title %}New thread in {{ cat.name }}{% endblock %}
{% block content %}
<h1>New thread in {{ cat.name }}</h1>
{% for er in errors %}<div class="error">{{ er }}</div>{% endfor %}
<form class="f" method="post" action="{{ url_for('new_thread') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="hidden" name="category" value="{{ cat.id }}">
<label for="title">Title</label>
<input type="text" id="title" name="title" required maxlength="200" value="{{ title }}">
<label for="body">Message</label>
<textarea id="body" name="body" required maxlength="20000">{{ body }}</textarea>
<button type="submit">Create thread</button>
</form>
{% endblock %}
