{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register</h1>
{% for er in errors %}<div class="error">{{ er }}</div>{% endfor %}
<form class="f" method="post" action="{{ url_for('register') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="username">Username</label>
<input type="text" id="username" name="username" required maxlength="32"
       pattern="[A-Za-z0-9_]{3,32}" value="{{ username }}">
<label for="email">Email (for reply notifications)</label>
<input type="email" id="email" name="email" required maxlength="254" value="{{ email }}">
<label for="password">Password (min 8 characters)</label>
<input type="password" id="password" name="password" required minlength="8">
<button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
