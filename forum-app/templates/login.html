{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
{% for er in errors %}<div class="error">{{ er }}</div>{% endfor %}
<form class="f" method="post" action="{{ url_for('login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="hidden" name="next" value="{{ next }}">
<label for="username">Username</label>
<input type="text" id="username" name="username" required maxlength="32" value="{{ username }}">
<label for="password">Password</label>
<input type="password" id="password" name="password" required>
<button type="submit">Log in</button>
</form>
<p>No account? <a href="{{ url_for('register') }}">Register</a>.</p>
{% endblock %}
